# ============================================
# SHARED QUARTO METADATA FOR ALL SLIDES
# Include this in course _quarto.yml files
# ============================================

# Author information
author: "Sebastian Freille"
institute: "Universidad Nacional de Córdoba"

# RevealJS format defaults
format:
  revealjs:
    # Self-contained output (no _files/ folders)
    embed-resources: true

    # Font loading (must be in <head>, not inside compiled CSS)
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">

    # Slide behavior
    slide-number: true
    preview-links: auto
    center-title-slide: true
    center: true

    # Dimensions
    width: 1500
    height: 900
    margin: 0.05

    # Table of contents
    toc: true
    toc-depth: 1
    toc-title: "Outline"

    # Captions
    tbl-cap-location: bottom
    fig-cap-location: bottom

    # Links
    link-external-newwindow: true

# Language settings (Spanish)
lang: es

# Execution options for code chunks
execute:
  echo: false
  warning: false
  message: false
