<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="'Source Sans Pro', Arial, sans-serif">
  <!-- triangle -->
  <polygon points="390,86 150,500 630,500" fill="none" stroke="#9bb3cc" stroke-width="2"/>
  <!-- highlight the side Argentina chose (top ↔ bottom-left) -->
  <line x1="390" y1="86" x2="150" y2="500" stroke="#1f4e79" stroke-width="5"/>

  <!-- center label -->
  <text x="390" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#1f3a5f">
    <tspan x="390">Solo se pueden</tspan><tspan x="390" dy="30">sostener DOS de TRES</tspan>
  </text>

  <!-- vertex: fixed exchange rate (chosen) -->
  <rect x="255" y="34" width="270" height="60" rx="10" fill="#1f4e79" stroke="#14324f" stroke-width="2"/>
  <text x="390" y="71" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Tipo de cambio fijo</text>

  <!-- vertex: capital mobility (chosen) -->
  <rect x="20" y="480" width="260" height="78" rx="10" fill="#1f4e79" stroke="#14324f" stroke-width="2"/>
  <text x="150" y="513" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">
    <tspan x="150">Libre movilidad</tspan><tspan x="150" dy="26">de capitales</tspan>
  </text>

  <!-- vertex: monetary autonomy (resigned) -->
  <rect x="500" y="480" width="260" height="78" rx="10" fill="#ffffff" stroke="#a02234" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="630" y="513" text-anchor="middle" font-size="20" font-weight="700" fill="#a02234">
    <tspan x="630">Política monetaria</tspan><tspan x="630" dy="26">autónoma</tspan>
  </text>
  <text x="630" y="462" text-anchor="middle" font-size="15" fill="#a02234">Argentina resignó esto</text>
</svg>
