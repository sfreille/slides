<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-label="Reaparición de la espiral de salarios y precios">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1f4e79" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Helvetica,Arial,sans-serif} .title{font-size:38px;font-weight:700;fill:#1f3a5f}.detail{font-size:32px;fill:#526477}.num{font-size:27px;font-weight:700;fill:#1f4e79}.label{font-size:28px;fill:#1f4e79}</style>
<text x="20" y="48" class="num" text-anchor="start">01</text>
<text x="20" y="108" class="title" text-anchor="start">Dólar y tarifas</text>
<text x="20" y="153" class="title" text-anchor="start">se reajustan</text>
<text x="20" y="220" class="detail" text-anchor="start">Impulso inicial</text>
<path d="M 310 133 H 355" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="370" y="48" class="num" text-anchor="start">02</text>
<text x="370" y="108" class="title" text-anchor="start">Cae el</text>
<text x="370" y="153" class="title" text-anchor="start">salario real</text>
<text x="370" y="220" class="detail" text-anchor="start">Pérdida de</text>
<text x="370" y="259" class="detail" text-anchor="start">poder de compra</text>
<path d="M 660 133 H 705" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="48" class="num" text-anchor="start">03</text>
<text x="720" y="108" class="title" text-anchor="start">Nuevos acuerdos</text>
<text x="720" y="153" class="title" text-anchor="start">salariales</text>
<text x="720" y="220" class="detail" text-anchor="start">Reclamos de</text>
<text x="720" y="259" class="detail" text-anchor="start">compensación</text>
<path d="M 1010 133 H 1055" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1070" y="48" class="num" text-anchor="start">04</text>
<text x="1070" y="108" class="title" text-anchor="start">Costos, precios</text>
<text x="1070" y="153" class="title" text-anchor="start">y expectativas</text>
<text x="1070" y="220" class="detail" text-anchor="start">Se propagan</text>
<text x="1070" y="259" class="detail" text-anchor="start">los aumentos</text>
<path d="M 1220 280 V 345 H 525 V 280" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="865" y="392" class="label" text-anchor="middle">Los precios vuelven a erosionar el salario</text>
</svg>