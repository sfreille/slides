<path d="M 1355 158 V 283" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 745 353 H 550" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 15 283 V 165" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
<text x="700" y="239" class="label" text-anchor="middle">La fragilidad se refuerza</text>
</svg>